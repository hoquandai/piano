services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    stdin_open: true
    tty: true
    ports:
      - 3000:3000
    environment:
      - RAILS_ENV=development
    volumes:
      - .:/rails
    working_dir: /rails
    command: bash -c "bundle exec rails db:create db:migrate && bundle exec rails server -b 0.0.0.0"
